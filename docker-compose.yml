services:
   db: 
    image: postgres:15
    environment:
       POSTGRES_USER: POSTGRES_USER
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_DB: my_own_db
    ports:
      - "5433:5432"
   redis:
     image: redis:7
     ports:
       - "6379:6379"
   app:
     build: .
     command: /bin/sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
     volumes:
       - .:/app
     ports:
       - "8000:8000"
     environment:
       - DBURL=postgresql://POSTGRES_USER:${POSTGRES_PASSWORD}@db:5432/my_own_db
       - REDIS_URL=redis://redis:6379/0
       - SECRET_KEY=${SECRET_KEY}
       - LOKI_URL=http://loki:3100/loki/api/v1/push
     depends_on:
       - db
       - redis
  # 4. Celery Worker
   worker:
     build: .
     command: celery -A src.infrastructure.celery.celery_app.celery_app worker --loglevel=info
     environment:
       - REDIS_URL=redis://redis:6379/0
     depends_on:
       - redis
       - db
 
   # 5. Prometheus
   prometheus:
     image: prom/prometheus
     volumes:
       - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
     ports:
       - "9090:9090"
 
   # 6. Grafana
   grafana:
     image: grafana/grafana
     ports:
       - "3000:3000"
     volumes:
       - ./grafana/provisioning:/etc/grafana/provisioning
     depends_on:
       - prometheus
   promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
   loki:
       image: grafana/loki:latest
       ports:
         - "3100:3100"
       command: -config.file=/etc/loki/local-config.yaml

volumes:
  app-data:
  postgres_data:
  prometheus-data:
  loki-data:
  grafana-data:
  redis-data: